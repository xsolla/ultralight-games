<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Puzzle and Racing</title>
  <link rel="stylesheet" href="css/styles.css" />

  <!-- three.js: единственная внешняя зависимость. Модуль подключается с CDN и кладётся в window.THREE,
       чтобы остальные файлы могли оставаться обычными скриптами без import/export (как в соседних играх). -->
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
  </script>
</head>
<body>
  <div id="wrap">
    <!-- 3D-сцена: canvas добавляет stage.js -->
    <div id="view">
      <!-- Строка состояния с технической информацией (ход, ряд, противники, отрыв лидера, сложность, намерения, fps,
           события) отключена. Чтобы вернуть, раскомментировать: Hud.refresh снова начнёт её заполнять. -->
      <!-- <div id="hud"></div> -->
      <div id="err"></div>
    </div>

    <!-- Разделитель между сценой и нижним боксом: HP игрока или счётчик цветов (hud.js) -->
    <div id="divider">
      <span class="hp-label">HP</span>
      <div id="hp-bar">
        <div id="hp-fill"></div>
        <span id="hp-text"></span>
      </div>
      <!-- Счётчик схлопнутых кристаллов по цветам: заменяет HP, пока в цепочке больше одного цвета (hud.js) -->
      <div id="tally"></div>
    </div>

    <!-- Нижний бокс: поле match-3 (рисует board.js) -->
    <div id="panel">
      <canvas id="board"></canvas>
    </div>

    <!-- Конец партии поверх всего: итог, ходы, рекорд и кнопки "Заново" и "Меню" (hud.js) -->
    <div id="over">
      <div class="over-box">
        <b id="over-title"></b>
        <span id="over-text"></span>
        <span id="over-note"></span>
        <div class="over-actions">
          <button id="over-restart" type="button">Play again</button>
          <button id="over-menu" type="button">Menu</button>
        </div>
      </div>
    </div>

    <!-- Титульный экран: логотип Xsolla, название, выбор сложности, лучшие результаты (title.js).
         SVG логотипа и значков кнопок вставляет chrome.js: в HTML не должно быть <svg>. -->
    <div id="title" class="show">
      <div id="title-logo"></div>
      <div class="title-main">
        <div id="title-gems"></div>
        <h1 class="title-name"><span class="t-puzzle">Puzzle</span><span class="t-and">and</span><span class="t-racing">Racing</span></h1>
        <div class="title-label">Difficulty</div>
        <div id="title-levels"></div>
        <button id="title-best" type="button">Best results</button>
        <p id="title-rules"></p>
      </div>
      <!-- Окно лучших результатов поверх титульного экрана -->
      <div id="best">
        <div class="best-box">
          <b class="best-title">Best results</b>
          <div id="best-list"></div>
          <p id="best-note"></p>
          <button id="best-back" type="button">Back</button>
        </div>
      </div>
    </div>

    <!-- Окно "How to play" (help.js): кнопка "?" в HUD -->
    <div id="help">
      <div id="help-box" class="help-box" role="dialog" aria-label="How to play">
        <b class="help-title">How to play</b>
        <!-- страница 1: цвета кристаллов и картинка ходов -->
        <div id="help-p1" class="help-page">
          <h3>What each crystal does</h3>
          <div id="help-tiles"></div>
          <h3>How your car moves</h3>
          <canvas id="help-moves"></canvas>
          <button id="help-next" class="help-btn" type="button">Page 2</button>
        </div>
        <!-- страница 2: ведение кристаллов, соперники, победа и поражение -->
        <div id="help-p2" class="help-page" hidden>
          <h3>Drag crystals</h3>
          <p id="help-drag"></p>
          <h3>Rivals, winning and losing</h3>
          <p id="help-rules"></p>
          <button id="help-close" class="help-btn" type="button">Got it</button>
        </div>
      </div>
    </div>

    <!-- Кнопки звука, выхода, полного экрана и помощи (chrome.js): выше всех окон, работают везде -->
    <div id="chrome"></div>
  </div>

  <!-- Порядок выполнения: модуль three, затем обычные скрипты по зависимостям. Модуль и defer-скрипты
       выполняются по порядку в документе, так что к main.js THREE уже есть.
       constants -> util, tween -> сцена и камера -> мир (изгиб, дорога, обочина, развилки)
       -> сущности (машины, значки, эффекты) -> правила, поведение противников и поле match-3 -> интерфейс (HUD, результаты, кнопки, титульный экран) и ввод -> main. -->
  <script type="module">
    import * as THREE from 'three';
    window.THREE = THREE;
  </script>
  <script defer src="js/constants.js"></script>
  <script defer src="js/util.js"></script>
  <script defer src="js/tween.js"></script>
  <script defer src="js/stage.js"></script>
  <script defer src="js/bend.js"></script>
  <script defer src="js/road.js"></script>
  <script defer src="js/roadside.js"></script>
  <script defer src="js/forks.js"></script>
  <script defer src="js/cars.js"></script>
  <script defer src="js/markers.js"></script>
  <script defer src="js/fx.js"></script>
  <script defer src="js/camera.js"></script>
  <script defer src="js/game.js"></script>
  <script defer src="js/ai.js"></script>
  <script defer src="js/match3.js"></script>
  <script defer src="js/crystals.js"></script>
  <script defer src="js/board.js"></script>
  <script defer src="js/boardfx.js"></script>
  <script defer src="js/hud.js"></script>
  <script defer src="js/results.js"></script>
  <script defer src="js/chrome.js"></script>
  <script defer src="js/title.js"></script>
  <script defer src="js/help.js"></script>
  <script defer src="js/input.js"></script>
  <script defer src="js/main.js"></script>
</body>
</html>
